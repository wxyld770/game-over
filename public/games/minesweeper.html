<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1718">
  <meta name="description" content="在线扫雷：首击安全、三档难度、触屏长按插旗和计时，打开即可玩。">
  <title>扫雷 · Game Over</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1718;--panel:#142521;--gold:#e9bf72;--gold-light:#f7d995;--paper:#f4eee1;--muted:#aebdb5;--line:rgba(242,231,201,.17);--green:#9be1bc;--red:#f29b83;font-family:"DM Sans","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;color:var(--paper);background:radial-gradient(circle at 75% 8%,#1b3d33,transparent 33rem),radial-gradient(circle at 0 100%,#163a31,transparent 25rem),var(--bg)}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold-light);outline-offset:3px}a{color:inherit;text-decoration:none}.shell{width:min(1120px,100%);margin:auto;padding:0 24px 46px}.topbar{min-height:76px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:.08em}.mark{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--gold);border-radius:12px;color:var(--gold-light);font-size:20px}.back{font-size:.88rem;color:var(--gold-light);border-bottom:1px solid #b9945e;padding-bottom:3px}.eyebrow{margin:34px 0 9px;color:var(--gold);font-size:.75rem;font-weight:800;letter-spacing:.22em}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.hero h1{margin:0;font-size:clamp(2.5rem,5vw,4.2rem);letter-spacing:-.05em;line-height:1.1}.hero p{margin:9px 0 0;color:var(--muted);line-height:1.6}.timer{border:1px solid #b9945e73;border-radius:12px;padding:11px 16px;color:var(--gold-light);font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
    .layout{display:grid;grid-template-columns:minmax(0,650px) minmax(250px,1fr);gap:22px;align-items:start}.game-card,.side-card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#1d3a32,#112520);box-shadow:0 18px 48px #0003}.game-card{padding:22px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:space-between;margin-bottom:16px}.toolbar label{display:flex;align-items:center;gap:9px;font-size:.86rem;color:var(--muted)}select{border:1px solid #e9bf7260;border-radius:9px;background:#0b2621;color:var(--paper);padding:9px 30px 9px 11px}.small-btn,.mode-btn{border:1px solid #e9bf7260;border-radius:9px;background:#102d26;color:var(--gold-light);font-weight:700}.small-btn{padding:9px 12px}.small-btn:hover,.mode-btn:hover{background:#244e3e}.mode-btn{padding:11px 13px;min-width:128px}.mode-btn.active{background:var(--gold);border-color:var(--gold);color:#17392d}.control-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.counter{padding:9px 12px;border:1px solid #e9bf724d;border-radius:10px;color:var(--gold-light);font-size:.9rem;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}.board-scroll{width:100%;overflow:auto;overscroll-behavior-x:contain;border-radius:10px;background:#0c3028;padding:9px}.board{display:grid;gap:2px;width:max-content;margin:auto;border:2px solid #9d7e4b;background:#9d7e4b;border-radius:5px;touch-action:manipulation}.cell{display:grid;place-items:center;width:var(--cell);height:var(--cell);padding:0;border:0;border-radius:2px;background:linear-gradient(145deg,#42725d,#2b5748);color:var(--paper);font-size:calc(var(--cell) * .57);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.cell:hover:not(.revealed){background:#56846b}.cell.revealed{background:#dfdbc7;color:#224334;cursor:default}.cell.flagged{color:var(--gold-light)}.cell.mine{background:#dbbca5;color:#5d2923}.cell.exploded{background:#e48572;color:#59211c}.cell.wrong-flag{background:#e1ad9d;color:#6b2622}.cell.n1{color:#205fa5}.cell.n2{color:#278047}.cell.n3{color:#a7433f}.cell.n4{color:#5d4da4}.cell.n5{color:#8e5635}.cell.n6{color:#2a8a90}.cell.n7{color:#243d3a}.cell.n8{color:#586155}.status{min-height:27px;margin:14px 0 0;color:var(--gold-light);font-size:.9rem;line-height:1.5}.status.error{color:var(--red)}.status.success{color:var(--green)}.side-card{padding:24px}.side-card h2{margin:0 0 14px;font-size:1.08rem}.side-card p,.side-card li{color:var(--muted);font-size:.91rem;line-height:1.8}.side-card ol{padding-left:20px;margin:0}.tip{margin-top:18px;padding:13px 15px;border:1px solid #e9bf724d;border-radius:11px;background:#e9bf720e;color:#e7d8b6;font-size:.84rem;line-height:1.7}
    @media(max-width:780px){.layout{grid-template-columns:1fr}.side-card{padding:18px}.shell{padding:0 12px 30px}.hero{margin-bottom:16px}.hero h1{font-size:2.5rem}.game-card{padding:11px;border-radius:15px}.board-scroll{padding:6px}.board{--cell:33px!important}.hero p{font-size:.84rem}}@media(max-width:430px){.toolbar{display:grid;grid-template-columns:1fr}.toolbar label{justify-content:space-between}.toolbar .small-btn{width:100%}.control-strip{gap:6px}.mode-btn{min-width:0;flex:1}.counter{font-size:.78rem;padding:9px 7px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="/" aria-label="返回游戏大厅"><span class="mark">✦</span><span>GAME OVER</span></a><a class="back" href="/">← 返回游戏大厅</a></header>
    <p class="eyebrow">SOLO PUZZLE · 02</p>
    <div class="hero"><div><h1>扫雷</h1><p>排除每一枚地雷，看看能走多远。</p></div><div class="timer" aria-label="用时">⏱ <span id="time">00:00</span></div></div>
    <main class="layout">
      <section class="game-card" aria-label="扫雷游戏">
        <div class="toolbar"><label for="difficulty">难度 <select id="difficulty"><option value="easy">新手 · 9×9</option><option value="medium">进阶 · 12×12</option><option value="hard">高手 · 16×16</option></select></label><button type="button" class="small-btn" id="new">↻ 重新开局</button></div>
        <div class="control-strip"><div class="counter" aria-label="剩余雷数">⚑ 剩余 <span id="remaining">10</span></div><button type="button" class="mode-btn" id="flag-mode" aria-pressed="false">⚑ 标旗模式：关</button></div>
        <div class="board-scroll"><div class="board" id="board" role="grid" aria-label="扫雷棋盘"></div></div>
        <p class="status" id="status" role="status" aria-live="polite">点开任意格开始，第一步一定安全。</p>
      </section>
      <aside class="side-card"><h2>玩法规则</h2><ol><li>点开格子，数字表示周围 8 格中有几枚雷。</li><li>推断有雷的位置后插旗；揭开所有安全格即获胜。</li><li>第一步和周围 8 格不会有雷。点开空白区域会自动展开。</li><li>如果数字周围的旗数恰好等于数字，再点该数字可同时打开剩余邻格；旗插错时可能踩雷。</li></ol><div class="tip">手机上长按格子插旗，或打开“标旗模式”后逐格点击。电脑上可右键插旗；方向键移动焦点，F 给焦点格插旗。高手棋盘在窄屏上可左右滑动。</div></aside>
    </main>
  </div>
  <script>
  (() => {
    'use strict';
    const configs = { easy: { size: 9, mines: 10, cell: 48 }, medium: { size: 12, mines: 22, cell: 42 }, hard: { size: 16, mines: 40, cell: 35 } };
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const timeEl = document.getElementById('time');
    const remainingEl = document.getElementById('remaining');
    const modeButton = document.getElementById('flag-mode');
    let game, buttons = [], flagMode = false, pressTimer = null, suppressClick = -1, pressPosition = null;
    function shuffled(items) {
      const copy = items.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
    function neighbors(index) {
      const row = Math.floor(index / game.size), col = index % game.size, indices = [];
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const r = row + dr, c = col + dc;
        if (r >= 0 && r < game.size && c >= 0 && c < game.size) indices.push(r * game.size + c);
      }
      return indices;
    }
    function setStatus(message, tone = '') { statusEl.textContent = message; statusEl.className = 'status' + (tone ? ` ${tone}` : ''); }
    function updateTime() {
      const elapsed = game.startedAt === null ? 0 : game.ended ? game.elapsed : Date.now() - game.startedAt;
      const seconds = Math.floor(elapsed / 1000);
      timeEl.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }
    function placeMines(firstIndex) {
      const safe = new Set([firstIndex, ...neighbors(firstIndex)]);
      const choices = shuffled(Array.from({ length: game.size * game.size }, (_, index) => index).filter(index => !safe.has(index)));
      for (const index of choices.slice(0, game.mines)) game.cells[index].mine = true;
      for (let index = 0; index < game.cells.length; index++) if (!game.cells[index].mine) game.cells[index].adjacent = neighbors(index).filter(i => game.cells[i].mine).length;
      game.generated = true;
      game.startedAt = Date.now();
      setStatus('观察数字，找出安全格。长按或右键可插旗。');
      updateTime();
    }
    function finish(won, exploded = -1) {
      game.ended = true;
      game.won = won;
      game.exploded = exploded;
      game.elapsed = Date.now() - game.startedAt;
      updateTime();
      if (won) {
        for (const cell of game.cells) if (cell.mine) cell.flagged = true;
        game.flags = game.mines;
        setStatus(`全部排除！你用了 ${timeEl.textContent} 完成挑战。`, 'success');
      } else setStatus('踩到地雷了！红色格为踩中的雷，点“重新开局”再试一次。', 'error');
      render(); updateTime();
    }
    function reveal(index) {
      if (game.ended || game.cells[index].flagged) return;
      if (game.cells[index].revealed) { chord(index); return; }
      if (!game.generated) placeMines(index);
      if (game.cells[index].mine) { finish(false, index); return; }
      const queue = [index], visited = new Set();
      while (queue.length) {
        const current = queue.pop();
        if (visited.has(current)) continue;
        visited.add(current);
        const cell = game.cells[current];
        if (cell.revealed || cell.flagged || cell.mine) continue;
        cell.revealed = true; game.revealedSafe++;
        if (cell.adjacent === 0) queue.push(...neighbors(current));
      }
      if (game.revealedSafe === game.cells.length - game.mines) { finish(true); return; }
      render();
    }
    function chord(index) {
      const cell = game.cells[index];
      if (!cell.revealed || !cell.adjacent || game.ended) return;
      const around = neighbors(index);
      if (around.filter(i => game.cells[i].flagged).length !== cell.adjacent) return;
      for (const neighbor of around) {
        if (game.ended) return;
        if (!game.cells[neighbor].flagged && !game.cells[neighbor].revealed) reveal(neighbor);
      }
    }
    function toggleFlag(index) {
      if (game.ended || game.cells[index].revealed) return;
      const cell = game.cells[index];
      if (!cell.flagged && game.flags >= game.mines) { setStatus('旗已用完，可以移除一面旗后重新标记。', 'error'); return; }
      cell.flagged = !cell.flagged;
      game.flags += cell.flagged ? 1 : -1;
      setStatus(cell.flagged ? '已插旗，继续排查其他格。' : '已移除旗帜。');
      render();
    }
    function act(index) { if (flagMode) toggleFlag(index); else reveal(index); }
    function clearPress() { if (pressTimer !== null) clearTimeout(pressTimer); pressTimer = null; pressPosition = null; }
    function buildBoard() {
      boardEl.replaceChildren();
      boardEl.style.gridTemplateColumns = `repeat(${game.size}, var(--cell))`;
      boardEl.style.setProperty('--cell', `${game.cell}px`);
      buttons = Array.from({ length: game.cells.length }, (_, index) => {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'cell'; button.setAttribute('role', 'gridcell');
        button.dataset.index = String(index);
        button.addEventListener('click', () => {
          if (suppressClick === index) { suppressClick = -1; return; }
          act(index);
        });
        button.addEventListener('contextmenu', event => {
          event.preventDefault();
          if (suppressClick === index) return;
          clearPress(); toggleFlag(index);
          suppressClick = index;
          setTimeout(() => { if (suppressClick === index) suppressClick = -1; }, 0);
        });
        button.addEventListener('pointerdown', event => {
          if (event.pointerType === 'mouse') return;
          clearPress();
          pressPosition = { x: event.clientX, y: event.clientY };
          pressTimer = setTimeout(() => {
            pressTimer = null;
            toggleFlag(index);
            suppressClick = index;
            if (navigator.vibrate) navigator.vibrate(20);
          }, 500);
        });
        button.addEventListener('pointermove', event => {
          if (pressPosition && Math.hypot(event.clientX - pressPosition.x, event.clientY - pressPosition.y) > 12) clearPress();
        });
        button.addEventListener('pointerup', () => {
          clearPress();
          if (suppressClick === index) setTimeout(() => { if (suppressClick === index) suppressClick = -1; }, 0);
        });
        button.addEventListener('pointercancel', clearPress);
        boardEl.append(button);
        return button;
      });
    }
    function render() {
      if (!game) return;
      remainingEl.textContent = String(game.mines - game.flags);
      modeButton.classList.toggle('active', flagMode);
      modeButton.setAttribute('aria-pressed', String(flagMode));
      modeButton.textContent = `⚑ 标旗模式：${flagMode ? '开' : '关'}`;
      game.cells.forEach((cell, index) => {
        const button = buttons[index];
        button.className = 'cell';
        let text = '';
        if (cell.revealed) {
          button.classList.add('revealed');
          if (cell.mine) { button.classList.add('mine'); text = '✹'; }
          else if (cell.adjacent) { button.classList.add(`n${cell.adjacent}`); text = String(cell.adjacent); }
        } else if (cell.flagged) { button.classList.add('flagged'); text = '⚑'; }
        if (game.ended && !game.won) {
          if (cell.mine && !cell.flagged) { button.classList.add('revealed', 'mine'); text = '✹'; }
          if (cell.flagged && !cell.mine) button.classList.add('wrong-flag');
          if (index === game.exploded) button.classList.add('exploded');
        }
        button.textContent = text;
        const row = Math.floor(index / game.size) + 1, col = index % game.size + 1;
        const description = game.ended && cell.mine ? '地雷' : cell.flagged ? '已插旗' : cell.revealed ? cell.adjacent ? `周围 ${cell.adjacent} 枚雷` : '空白' : '未翻开';
        button.setAttribute('aria-label', `第 ${row} 行第 ${col} 列，${description}`);
      });
    }
    function newGame() {
      clearPress(); suppressClick = -1; flagMode = false;
      const config = configs[document.getElementById('difficulty').value];
      game = { ...config, generated: false, cells: Array.from({ length: config.size * config.size }, () => ({ mine: false, adjacent: 0, revealed: false, flagged: false })), flags: 0, revealedSafe: 0, startedAt: null, elapsed: 0, ended: false, won: false, exploded: -1 };
      buildBoard(); render(); updateTime();
      setStatus('点开任意格开始，第一步和周围 8 格都安全。');
    }
    document.getElementById('new').addEventListener('click', newGame);
    document.getElementById('difficulty').addEventListener('change', newGame);
    modeButton.addEventListener('click', () => { flagMode = !flagMode; render(); setStatus(flagMode ? '标旗模式已开启：点击格子插旗或移除旗。' : '翻格模式已开启：点击格子揭开。'); });
    document.addEventListener('keydown', event => {
      const active = document.activeElement;
      if (!active || !active.matches('#board .cell')) return;
      const index = Number(active.dataset.index);
      if (event.key.toLowerCase() === 'f') { event.preventDefault(); toggleFlag(index); return; }
      const movements = { ArrowUp: -game.size, ArrowDown: game.size, ArrowLeft: -1, ArrowRight: 1 };
      if (!(event.key in movements)) return;
      event.preventDefault();
      let next = index;
      if (event.key === 'ArrowUp' && index >= game.size) next -= game.size;
      if (event.key === 'ArrowDown' && index < game.size * (game.size - 1)) next += game.size;
      if (event.key === 'ArrowLeft' && index % game.size > 0) next--;
      if (event.key === 'ArrowRight' && index % game.size < game.size - 1) next++;
      buttons[next].focus();
    });
    newGame();
    setInterval(updateTime, 1000);
  })();
  </script>
</body>
</html>
