<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102c38" />
  <meta name="description" content="按住蓄力，松开起跳，跨过一个个平台。免费在线玩跳一跳。" />
  <title>跳一跳 · 小游戏大厅</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="/jump-rules.js"></script>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; color-scheme: dark; color: #f8f4e9; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 20% -5%, #226170 0, transparent 40%), #102c38; }
    [hidden] { display: none !important; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid #f9d68c; outline-offset: 3px; }
    .shell { width: min(1050px, 100%); margin: auto; padding: 22px 22px 50px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 25px; }
    .back { color: #f1d299; font-weight: 700; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .brand { color: #abc8cc; font-size: .76rem; letter-spacing: .18em; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 20px; }
    .eyebrow { color: #f2d29b; font-size: .7rem; font-weight: 800; letter-spacing: .2em; }
    h1 { margin: 8px 0 5px; font-size: 2.5rem; line-height: 1.2; }
    .intro p { margin: 0; color: #c7d8d9; line-height: 1.65; font-size: .9rem; }
    .scoreboard { display: flex; gap: 10px; flex: none; }
    .scorebox { min-width: 110px; padding: 12px 16px; border: 1px solid rgba(255,255,255,.16); border-radius: 13px; background: rgba(3,27,35,.45); }
    .scorebox span { display: block; color: #b4cacc; font-size: .72rem; }
    .scorebox strong { display: block; margin-top: 3px; color: #ffdc9c; font-size: 1.55rem; font-variant-numeric: tabular-nums; }
    .play-layout { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 25px; align-items: start; }
    .play-area { min-width: 0; }
    .game-wrap { position: relative; overflow: hidden; border: 1px solid rgba(224,245,242,.23); border-radius: 8px; background: #173f4b; }
    canvas { display: block; width: 100%; height: 450px; touch-action: none; cursor: pointer; }
    .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-top: 15px; }
    .message { margin: 0; color: #e9f0e9; min-height: 26px; line-height: 1.55; font-size: .93rem; }
    .actions { display: flex; gap: 10px; }
    .action { min-height: 43px; padding: 0 17px; border: 1px solid #eac788; border-radius: 8px; color: #17323a; background: #f1cd8b; font-weight: 800; }
    .action:hover { filter: brightness(1.08); }
    .action.secondary { color: #f5d79d; background: transparent; }
    .instruction { margin-top: 27px; padding: 21px 24px; border: 1px solid rgba(255,255,255,.12); border-radius: 17px; background: rgba(5,31,41,.45); }
    .instruction h2 { margin: 0 0 8px; font-size: 1rem; }
    .instruction p { margin: 0; color: #bfd3d4; font-size: .85rem; line-height: 1.75; }
    .leaderboard { min-width: 0; padding-left: 22px; border-left: 1px solid rgba(255,255,255,.16); }
    .leaderboard-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .leaderboard-head h2 { margin: 0; font-size: 1.15rem; }
    .leaderboard-head small { display: block; margin-top: 5px; color: #abc8cc; font-size: .72rem; }
    .icon-button { display: grid; place-items: center; flex: none; width: 36px; height: 36px; padding: 0; border: 1px solid #72969a; border-radius: 6px; color: #f5d79d; background: transparent; font-size: 1.35rem; }
    .personal-record { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0 16px; padding-bottom: 17px; border-bottom: 1px solid rgba(255,255,255,.16); }
    .personal-record span { display: block; color: #abc8cc; font-size: .73rem; }
    .personal-record strong { display: block; margin-top: 6px; color: #ffdc9c; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
    .ranking-list { margin: 0; padding: 0; list-style: none; }
    .ranking-row { display: grid; grid-template-columns: 26px minmax(0,1fr) 5ch; align-items: center; gap: 9px; min-height: 44px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.09); font-size: .86rem; }
    .ranking-place { color: #9ab5ba; font-variant-numeric: tabular-nums; }
    .ranking-row:nth-child(-n+3) .ranking-place { color: #f3cf8c; font-weight: 800; }
    .ranking-name { overflow-wrap: anywhere; line-height: 1.4; }
    .ranking-score { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
    .ranking-status { min-height: 21px; margin: 12px 0 0; color: #abc8cc; font-size: .8rem; line-height: 1.5; }
    .score-form { margin-top: 18px; padding: 16px 0; border-block: 1px solid rgba(255,255,255,.16); }
    .score-form h2 { margin: 0 0 12px; font-size: 1.05rem; color: #ffdc9c; }
    .score-form label { display: block; margin-bottom: 7px; color: #c7d8d9; font-size: .83rem; }
    .submit-row { display: flex; gap: 10px; }
    .submit-row input { min-width: 0; width: 100%; min-height: 43px; padding: 9px 12px; border: 1px solid #72969a; border-radius: 6px; background: #0a2530; color: #f8f4e9; }
    .submit-row .action { flex: none; }
    .score-status { min-height: 22px; margin: 10px 0 0; font-size: .83rem; line-height: 1.5; color: #c7d8d9; }
    .score-status.error, .ranking-status.error { color: #ffbba2; }
    .score-status.success { color: #ade6c7; }
    .ranked-run-status { min-height: 19px; margin: 7px 0 0; color: #abc8cc; font-size: .77rem; }
    @media (max-width: 850px) { .play-layout { grid-template-columns: 1fr; } .leaderboard { padding: 22px 0 0; border-left: 0; border-top: 1px solid rgba(255,255,255,.16); } .ranking-list { display: grid; grid-template-columns: 1fr 1fr; column-gap: 25px; } }
    @media (max-width: 630px) { .shell { padding: 15px 12px 35px; } header { padding-bottom: 15px; } .intro { align-items: start; flex-direction: column; gap: 13px; } .intro h1 { font-size: 2rem; } .scoreboard { width: 100%; gap: 8px; } .scorebox { flex: 1; min-width: 0; padding: 9px 11px; border-radius: 8px; } .scorebox strong { font-size: 1.3rem; } canvas { height: 390px; } .instruction { padding: 16px; } .ranking-list { grid-template-columns: 1fr; } }
    @media (max-width: 380px) { .brand { display: none; } canvas { height: 350px; } }
    .feedback-link { margin: 20px 0 0; text-align: right; font-size: .8rem; opacity: .8; }
    .feedback-link a { text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <div class="shell">
    <header><a class="back" href="/">← 游戏大厅</a><span class="brand">GAME OVER · JUMP</span></header>
    <div class="intro"><div><span class="eyebrow">HOLD · CHARGE · RELEASE</span><h1>跳一跳</h1><p>按住屏幕蓄力，松开跳到下一个平台。空格键也可以操作。</p></div><div class="scoreboard"><div class="scorebox"><span>当前得分</span><strong id="score">0</strong></div><div class="scorebox"><span>最高得分</span><strong id="best">0</strong></div><div class="scorebox"><span>完美连击</span><strong id="combo">0</strong></div></div></div>
    <main class="play-layout">
      <section class="play-area" aria-label="跳一跳游戏">
      <div class="game-wrap"><canvas id="game" tabindex="0" aria-label="跳一跳游戏画面，按住蓄力，松开起跳"></canvas></div>
      <div class="controls"><p class="message" id="message" role="status">按住画面或空格键蓄力，观察角色和蓄力条后松开。</p><div class="actions"><button class="action secondary" id="restart" type="button">重新开始</button></div></div>
      <p class="ranked-run-status" id="rankedRunStatus" role="status"></p>
      <form class="score-form" id="scoreForm" hidden>
        <h2 id="finishScore">本局成绩</h2>
        <label for="nickname">上榜昵称</label>
        <div class="submit-row"><input id="nickname" name="nickname" maxlength="18" autocomplete="nickname" placeholder="输入昵称" required><button class="action" id="submitScore" type="submit">提交成绩</button></div>
        <p class="score-status" id="scoreStatus" role="status" aria-live="polite"></p>
      </form>
      <section class="instruction"><h2>怎么玩</h2><p>按住越久，跳得越远；角色会压低身体蓄势。落到新平台得 1 分，踩中平台中央额外得 2 分；连续完美落点还会增加连击奖励。带 ★ 的星光平台再奖励 3 分。掉下去就结束，可立即重玩。</p></section>
      </section>
      <aside class="leaderboard" aria-labelledby="leaderboardTitle">
        <div class="leaderboard-head"><div><h2 id="leaderboardTitle">全站排行榜</h2><small>历史最高 · TOP 20</small></div><button class="icon-button" id="refreshRanking" type="button" title="刷新排行榜" aria-label="刷新排行榜">↻</button></div>
        <div class="personal-record"><div><span>我的排名</span><strong id="myRank">--</strong></div><div><span>已上榜最高分</span><strong id="myScore">--</strong></div></div>
        <ol class="ranking-list" id="rankingList"></ol>
        <p class="ranking-status" id="rankingStatus" role="status" aria-live="polite">正在加载排行榜...</p>
      </aside>
    </main>
    <p class="feedback-link"><a href="mailto:wxyld770@gmail.com?subject=GAME%20OVER%20%E5%8F%8D%E9%A6%88">意见反馈</a></p>
  </div>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const message = document.getElementById('message');
      const scoreText = document.getElementById('score');
      const bestText = document.getElementById('best');
      const comboText = document.getElementById('combo');
      const restart = document.getElementById('restart');
      const rules = window.JumpRules;
      const scoreForm = document.getElementById('scoreForm');
      const nickname = document.getElementById('nickname');
      const submitScore = document.getElementById('submitScore');
      const scoreStatus = document.getElementById('scoreStatus');
      const rankingList = document.getElementById('rankingList');
      const rankingStatus = document.getElementById('rankingStatus');
      const refreshRanking = document.getElementById('refreshRanking');
      const rankedRunStatus = document.getElementById('rankedRunStatus');
      let game;
      let rankedRun = null;
      let runVersion = 0;
      let jumpHistory = [];
      let physicsDebt = 0;
      let submitting = false;
      let rankingLoading = false;
      let displayWidth = 900;
      let displayHeight = 450;
      let pixelRatio = 1;
      let viewScale = 1;
      let baseViewScale = 1;
      let width = 900;
      let height = 450;
      const scale = 1;
      let platforms = [];
      let player;
      let cameraX = 0;
      let cameraCenterX = 0;
      let cameraView = {};
      let score = 0;
      let best = 0;
      let perfectStreak = 0;
      let particles = [];
      let impactAt = -1000;
      const reducedMotion = Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      let charging = false;
      let chargeSource = null;
      let activePointerId = null;
      let chargeStart = 0;
      let charge = 0;
      let state = 'loading';
      let lastFrame = performance.now();
      try { best = Math.max(0, Number(localStorage.getItem('jump:best')) || 0); } catch {}
      try { nickname.value = localStorage.getItem('jump:name') || ''; } catch {}
      bestText.textContent = best;

      function fit() {
        const rect = canvas.getBoundingClientRect();
        displayWidth = rect.width;
        displayHeight = rect.height;
        baseViewScale = Math.max(.74, Math.min(1, displayWidth / 760));
        viewScale = baseViewScale;
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(displayWidth * pixelRatio);
        canvas.height = Math.round(displayHeight * pixelRatio);
        updateView(0, true);
      }

      function syncGame() {
        platforms = game.platforms;
        player = game.player;
        score = game.score;
        perfectStreak = game.perfectStreak;
        state = game.state;
      }

      function updateView(dt, snap = false) {
        const view = rules.updateCameraView({ ...cameraView, scale: viewScale, centerX: cameraCenterX }, {
          player, platforms, previewPlatform: game?.previewPlatform, displayWidth, displayHeight, baseViewScale,
        }, dt, snap);
        cameraView = view;
        viewScale = view.scale;
        width = view.width;
        height = view.height;
        cameraCenterX = view.centerX;
        cameraX = view.cameraX;
        ctx.setTransform(pixelRatio * viewScale, 0, 0, pixelRatio * viewScale, 0, 0);
      }

      async function request(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          signal: AbortSignal.timeout(6000),
        });
        let data = {};
        try { data = await response.json(); } catch {}
        if (!response.ok) throw new Error(data.error || '排行榜暂时不可用，请稍后重试');
        return data;
      }

      function renderRanking(data) {
        rankingList.replaceChildren();
        for (const entry of data.entries || []) {
          const item = document.createElement('li');
          item.className = 'ranking-row';
          const place = document.createElement('span');
          place.className = 'ranking-place';
          place.textContent = entry.rank;
          const name = document.createElement('span');
          name.className = 'ranking-name';
          name.textContent = entry.name;
          const points = document.createElement('span');
          points.className = 'ranking-score';
          points.textContent = entry.score;
          item.append(place, name, points);
          rankingList.append(item);
        }
        document.getElementById('myRank').textContent = data.me ? '#' + data.me.rank : '--';
        document.getElementById('myScore').textContent = data.me ? data.me.score : '--';
        rankingStatus.className = 'ranking-status';
        rankingStatus.textContent = data.entries?.length ? '' : '还没有上榜成绩。';
      }

      async function loadRanking() {
        if (rankingLoading) return;
        rankingLoading = true;
        refreshRanking.disabled = true;
        rankingStatus.className = 'ranking-status';
        rankingStatus.textContent = '正在加载排行榜...';
        try { renderRanking(await request('/api/jump/leaderboard')); }
        catch (error) {
          rankingStatus.className = 'ranking-status error';
          rankingStatus.textContent = error.name === 'TimeoutError' || error.name === 'TypeError' ? '无法连接排行榜，请稍后刷新。' : error.message;
        } finally {
          rankingLoading = false;
          refreshRanking.disabled = false;
        }
      }

      async function start() {
        const version = ++runVersion;
        rankedRun = null;
        jumpHistory = [];
        physicsDebt = 0;
        submitting = false;
        particles = [];
        impactAt = -1000;
        const randomSeed = new Uint32Array(1);
        crypto.getRandomValues(randomSeed);
        game = rules.createGame(randomSeed[0]);
        syncGame();
        cameraX = 0;
        cameraCenterX = 0;
        cameraView = {};
        scoreText.textContent = '0';
        comboText.textContent = '0';
        charging = false;
        chargeSource = null;
        activePointerId = null;
        charge = 0;
        state = 'loading';
        scoreForm.hidden = true;
        scoreStatus.textContent = '';
        scoreStatus.className = 'score-status';
        nickname.disabled = false;
        submitScore.disabled = false;
        submitScore.textContent = '提交成绩';
        restart.disabled = true;
        message.textContent = '正在准备本局...';
        rankedRunStatus.textContent = '';
        updateView(0, true);
        try {
          const createRun = () => request('/api/jump/runs', { method: 'POST', body: '{}' });
          // Serialize first visits across tabs so they share the same player Cookie.
          const run = navigator.locks
            ? await navigator.locks.request('game-over:jump:start', createRun)
            : await createRun();
          if (version !== runVersion) return;
          rankedRun = run;
          game = rules.createGame(run.seed);
          syncGame();
          updateView(0, true);
          loadRanking();
        } catch {
          if (version !== runVersion) return;
          state = 'ready';
          rankedRunStatus.textContent = '排行榜连接失败，本局仍可游玩。';
        } finally {
          if (version === runVersion) {
            restart.disabled = false;
            message.textContent = '按住画面或空格键蓄力，观察角色和蓄力条后松开。';
          }
        }
      }

      function beginCharge(source) {
        if (state !== 'ready' || charging) return;
        charging = true;
        chargeSource = source;
        chargeStart = performance.now();
        charge = 0;
        message.textContent = '正在蓄势……看好距离，松开就跳！';
      }

      function cancelCharge(source) {
        if (!charging || chargeSource !== source) return;
        charging = false;
        chargeSource = null;
        charge = 0;
        message.textContent = '蓄力已取消，按住画面或空格键再试一次。';
      }

      function release(source) {
        if (!charging || state !== 'ready' || chargeSource !== source) return;
        charging = false;
        chargeSource = null;
        const holdMs = Math.min(rules.MAX_HOLD_MS, Math.max(0, Math.round(performance.now() - chargeStart)));
        charge = holdMs / rules.MAX_HOLD_MS;
        const rankingLimit = rankedRun && (Date.now() >= rankedRun.expiresAt
          ? '本局上榜时限已到，最高分保留在本机。'
          : jumpHistory.length >= rules.MAX_JUMPS ? '本局起跳次数已达到上榜上限，最高分保留在本机。' : '');
        if (rankingLimit) {
          rankedRun = null;
          jumpHistory = [];
          rankedRunStatus.textContent = rankingLimit;
        }
        if (rankedRun) jumpHistory.push(holdMs);
        physicsDebt = 0;
        rules.jump(game, holdMs);
        syncGame();
        burst(player.x, player.y + player.r, '#f7ce78', 7);
        message.textContent = '起跳！瞄准平台中间，完美落点有额外奖励。';
      }

      function burst(x, y, color, count) {
        if (reducedMotion) return;
        for (let i = 0; i < count; i += 1) {
          const angle = -Math.PI + Math.random() * Math.PI;
          const speed = (50 + Math.random() * 95) * scale;
          particles.push({ type: 'spark', x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: .7, maxLife: .7, color });
        }
      }

      function floatPoints(x, y, label, color) {
        particles.push({ type: 'label', x, y, vx: 0, vy: -45 * scale, life: 1.15, maxLife: 1.15, label, color });
      }

      function land(event) {
        const { platform, perfect, earned } = event;
        charge = 0;
        impactAt = performance.now();
        platform.pulse = 1;
        burst(player.x, platform.y, platform.special === 'star' ? '#ffdc87' : '#a6efdb', 13);
        if (event.advanced) {
          const specialBonus = platform.special === 'star' ? 3 : 0;
          scoreText.textContent = score;
          comboText.textContent = perfectStreak;
          if (score > best) {
            best = score;
            bestText.textContent = best;
            try { localStorage.setItem('jump:best', String(best)); } catch {}
          }
          floatPoints(player.x, platform.y - 25 * scale,
            (perfect ? '完美 ' : platform.special === 'star' ? '星光 ' : '') + '+' + earned,
            perfect || specialBonus ? '#ffe19a' : '#d7f8e5');
          if (perfect) {
            message.textContent = '完美落点！本次 +' + earned + ' 分'
              + (perfectStreak > 1 ? '，连续 ' + perfectStreak + ' 次中心着陆！' : '！');
          } else if (specialBonus) {
            message.textContent = '踩中星光平台！本次 +' + earned + ' 分。';
          } else {
            message.textContent = '成功落地！本次 +1 分。瞄准中间可得更多分。';
          }
        } else {
          comboText.textContent = '0';
          message.textContent = '还在当前平台上，再多蓄一点力试试。';
        }
      }

      function update(dt, now) {
        if (charging) charge = Math.min(1, (now - chargeStart) / 1100);
        for (const platform of platforms) platform.pulse = Math.max(0, (platform.pulse || 0) - dt * 3);
        for (const particle of particles) {
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          if (particle.type === 'spark') particle.vy += 160 * scale * dt;
          particle.life -= dt;
        }
        particles = particles.filter((particle) => particle.life > 0);
        if (state === 'jumping') {
          // Fixed steps keep browser landings identical to server replay.
          physicsDebt += dt;
          while (physicsDebt >= rules.STEP_SECONDS && state === 'jumping') {
            physicsDebt -= rules.STEP_SECONDS;
            const event = rules.step(game);
            syncGame();
            if (event?.landed) land(event);
            if (event?.over) {
              message.textContent = `掉下去了！本次得分 ${score} 分，点击“重新开始”再来。`;
              document.getElementById('finishScore').textContent = `本局 ${score} 分`;
              scoreForm.hidden = !rankedRun || score === 0;
              if (!scoreForm.hidden && window.matchMedia('(max-width:630px)').matches) {
                scoreForm.scrollIntoView({ block: 'nearest', behavior: reducedMotion ? 'auto' : 'smooth' });
              }
            }
          }
        }
        updateView(dt);
      }

      function roundedRect(x, y, w, h, radius) {
        ctx.beginPath();
        if (typeof ctx.roundRect === 'function') { ctx.roundRect(x, y, w, h, radius); return; }
        const r = Math.min(radius, w / 2, h / 2);
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function draw(now) {
        const floorOffset = height - 105;
        ctx.clearRect(0, 0, width, height);
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, '#194f60');
        sky.addColorStop(1, '#102b41');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = 'rgba(255,235,180,.06)';
        for (let i = 0; i < 18; i += 1) {
          const x = ((i * 173 + 40 - cameraX * .22) % (width + 100) + width + 100) % (width + 100);
          ctx.beginPath();
          ctx.arc(x, 40 + (i * 79) % Math.max(150, height - 120), 2 + (i % 3), 0, Math.PI * 2);
          ctx.fill();
        }
        const baseline = height - 72 * scale;
        ctx.fillStyle = 'rgba(3,22,34,.23)';
        for (let i = 0; i < 12; i += 1) {
          const x = i * 100 * scale - (cameraX * .4) % (100 * scale);
          ctx.beginPath();
          ctx.moveTo(x, height);
          ctx.lineTo(x + 80 * scale, baseline + (i % 3) * 19 * scale);
          ctx.lineTo(x + 160 * scale, height);
          ctx.closePath();
          ctx.fill();
        }
        platforms.forEach((platform, index) => {
          const x = platform.x - cameraX;
          const y = platform.y + floorOffset;
          if (x + platform.w < -25 || x > width + 25) return;
          const center = x + platform.w / 2;
          ctx.fillStyle = 'rgba(4,15,22,.28)';
          roundedRect(x + 7 * scale, y + 8 * scale, platform.w, platform.h + 8 * scale, 10 * scale);
          ctx.fill();
          ctx.fillStyle = platform.special === 'star' ? '#b37f35' : 'hsl(' + platform.hue + ' 43% 46%)';
          roundedRect(x, y, platform.w, platform.h, 10 * scale);
          ctx.fill();
          ctx.fillStyle = platform.special === 'star' ? '#ffe3a3' : index === 0 ? '#d9d89c' : '#a7e3d2';
          roundedRect(x + 6 * scale, y + 2 * scale, platform.w - 12 * scale, 5 * scale, 4 * scale);
          ctx.fill();
          if (platform.special === 'star') {
            ctx.fillStyle = '#fff1bf';
            ctx.textAlign = 'center';
            ctx.font = '900 ' + Math.max(14, 18 * scale) + 'px sans-serif';
            ctx.fillText('★', center, y + 21 * scale);
            ctx.font = '800 ' + Math.max(10, 11 * scale) + 'px sans-serif';
            ctx.fillText('+3', center, y - 6 * scale);
          } else {
            ctx.fillStyle = 'rgba(255,244,191,.75)';
            roundedRect(center - platform.w * .12, y + 8 * scale,
              platform.w * .24, 4 * scale, 2 * scale);
            ctx.fill();
          }
          if (platform.pulse > 0) {
            ctx.strokeStyle = 'rgba(255,232,166,' + platform.pulse + ')';
            ctx.lineWidth = (1 + platform.pulse * 3) * scale;
            roundedRect(x - 2 * scale, y - 2 * scale,
              platform.w + 4 * scale, platform.h + 4 * scale, 12 * scale);
            ctx.stroke();
          }
        });

        if (charging && player.standing) {
          const bx = Math.max(15, Math.min(width - 150, player.x - cameraX - 65));
          const by = Math.max(24, player.y + floorOffset - 86 * scale);
          ctx.fillStyle = 'rgba(4,26,32,.78)';
          roundedRect(bx, by, 130, 13, 7);
          ctx.fill();
          ctx.fillStyle = charge > .87 ? '#fff0b3' : '#ffd57d';
          roundedRect(bx, by, 130 * charge, 13, 7);
          ctx.fill();
          ctx.fillStyle = '#fff2c8';
          ctx.textAlign = 'center';
          ctx.font = '800 ' + Math.max(10, 12 * scale) + 'px sans-serif';
          ctx.fillText('蓄力 ' + Math.round(charge * 100) + '%', bx + 65, by - 7);
          const cx = player.x - cameraX;
          ctx.strokeStyle = 'rgba(255,223,153,' + (.2 + charge * .55) + ')';
          ctx.lineWidth = 2 * scale;
          for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(cx + side * (26 + charge * 3) * scale, player.y + floorOffset - 14 * scale);
            ctx.lineTo(cx + side * (35 + charge * 8) * scale, player.y + floorOffset - 21 * scale);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx + side * (28 + charge * 4) * scale, player.y + floorOffset + 5 * scale);
            ctx.lineTo(cx + side * (39 + charge * 6) * scale, player.y + floorOffset + 4 * scale);
            ctx.stroke();
          }
        }

        const px = player.x - cameraX;
        const py = player.y + floorOffset;
        let stretchX = 1;
        let stretchY = 1;
        if (charging) {
          stretchX = 1 + charge * .22;
          stretchY = 1 - charge * .36;
        } else if (state === 'jumping') {
          stretchX = player.vy < 0 ? .87 : 1.05;
          stretchY = player.vy < 0 ? 1.18 : .94;
        } else {
          const impact = Math.max(0, 1 - (now - impactAt) / 290);
          stretchX = 1 + impact * .2;
          stretchY = 1 - impact * .29;
        }
        ctx.fillStyle = 'rgba(0,0,0,.2)';
        ctx.beginPath();
        ctx.ellipse(px, Math.min(height - 8, py + player.r + 16 * scale),
          (22 + (charging ? charge * 7 : 0)) * scale, 5 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.save();
        ctx.translate(px, py + player.r * (1 - stretchY));
        ctx.scale(stretchX, stretchY);
        ctx.fillStyle = state === 'over' ? '#e4a187' : '#ffe1a1';
        ctx.beginPath();
        ctx.arc(0, 0, player.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#203b47';
        ctx.beginPath();
        ctx.arc(-6 * scale, -3 * scale, 2 * scale, 0, Math.PI * 2);
        ctx.arc(6 * scale, -3 * scale, 2 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#203b47';
        ctx.lineWidth = 2 * scale;
        ctx.beginPath();
        ctx.arc(0, 2 * scale, 5 * scale, .12, Math.PI - .12);
        ctx.stroke();
        ctx.restore();
        for (const particle of particles) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, particle.life / Math.min(particle.maxLife, .35));
          ctx.fillStyle = particle.color;
          if (particle.type === 'label') {
            ctx.textAlign = 'center';
            ctx.font = '900 ' + Math.max(15, 22 * scale) + 'px sans-serif';
            ctx.fillText(particle.label, particle.x - cameraX, particle.y + floorOffset);
          } else {
            ctx.beginPath();
            ctx.arc(particle.x - cameraX, particle.y + floorOffset, 2.7 * scale, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        if (state === 'over') {
          ctx.fillStyle = 'rgba(4,20,28,.5)';
          ctx.fillRect(0, 0, width, height);
          ctx.fillStyle = '#fff0d6';
          ctx.textAlign = 'center';
          ctx.font = `700 ${Math.max(24, 34 * scale)}px sans-serif`;
          ctx.fillText('这次没跳过去', width / 2, height / 2 - 10);
          ctx.font = `${Math.max(14, 17 * scale)}px sans-serif`;
          ctx.fillText('点击下方按钮，再来一次', width / 2, height / 2 + 24);
        }
      }

      function frame(now) {
        const dt = rules.frameDeltaSeconds(now, lastFrame);
        lastFrame = now;
        update(dt, now);
        draw(now);
        requestAnimationFrame(frame);
      }

      canvas.addEventListener('pointerdown', (event) => {
        if (state !== 'ready' || charging) return;
        event.preventDefault();
        canvas.focus({ preventScroll: true });
        activePointerId = event.pointerId;
        canvas.setPointerCapture(event.pointerId);
        beginCharge('pointer');
      });
      canvas.addEventListener('pointerup', (event) => {
        if (activePointerId !== event.pointerId) return;
        event.preventDefault();
        activePointerId = null;
        release('pointer');
      });
      canvas.addEventListener('pointercancel', (event) => {
        if (activePointerId !== event.pointerId) return;
        activePointerId = null;
        cancelCharge('pointer');
      });
      window.addEventListener('keydown', (event) => {
        if (event.code !== 'Space' || event.repeat || (event.target !== canvas && event.target !== document.body)) return;
        event.preventDefault();
        beginCharge('keyboard');
      });
      window.addEventListener('keyup', (event) => {
        if (event.code !== 'Space' || chargeSource !== 'keyboard') return;
        event.preventDefault();
        release('keyboard');
      });
      window.addEventListener('blur', () => {
        cancelCharge(chargeSource);
        activePointerId = null;
      });
      scoreForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (submitting || !rankedRun || state !== 'over') return;
        const name = nickname.value.trim();
        if (!name || [...name].length > 18) {
          scoreStatus.className = 'score-status error';
          scoreStatus.textContent = '请输入 1 到 18 个字符的昵称。';
          nickname.focus();
          return;
        }
        const version = runVersion;
        submitting = true;
        submitScore.disabled = true;
        nickname.disabled = true;
        submitScore.textContent = '提交中...';
        scoreStatus.className = 'score-status';
        scoreStatus.textContent = '';
        try {
          const result = await request(`/api/jump/runs/${rankedRun.runId}/finish`, {
            method: 'POST', body: JSON.stringify({ name, jumps: jumpHistory }),
          });
          if (version !== runVersion) return;
          try { localStorage.setItem('jump:name', name); } catch {}
          renderRanking(result);
          scoreStatus.className = 'score-status success';
          scoreStatus.textContent = result.isPersonalBest
            ? `新纪录 ${result.personalBest} 分，当前第 ${result.rank} 名！`
            : `成绩已提交，个人最高 ${result.personalBest} 分，当前第 ${result.rank} 名。`;
          submitScore.textContent = '已提交';
        } catch (error) {
          if (version !== runVersion) return;
          scoreStatus.className = 'score-status error';
          scoreStatus.textContent = error.name === 'TimeoutError' || error.name === 'TypeError' ? '提交失败，请检查网络后重试。' : error.message;
          submitScore.disabled = false;
          nickname.disabled = false;
          submitScore.textContent = '重试提交';
        } finally {
          if (version === runVersion) submitting = false;
        }
      });
      refreshRanking.addEventListener('click', loadRanking);
      restart.addEventListener('click', start);
      window.addEventListener('resize', fit);
      fit();
      loadRanking();
      start();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
