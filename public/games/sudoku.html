<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1718">
  <meta name="description" content="在线数独：三种难度、候选笔记、冲突提示与计时，打开即可玩。">
  <title>数独 · Game Over</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1718;--panel:#142521;--felt:#0c4538;--gold:#e9bf72;--gold-light:#f7d995;--paper:#f4eee1;--muted:#aebdb5;--line:rgba(242,231,201,.17);--red:#f29b83;--green:#9be1bc;font-family:"DM Sans","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;color:var(--paper);background:radial-gradient(circle at 75% 8%,#1b3d33,transparent 33rem),radial-gradient(circle at 0 100%,#163a31,transparent 25rem),var(--bg)}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold-light);outline-offset:3px}a{color:inherit;text-decoration:none}
    .shell{width:min(1120px,100%);margin:auto;padding:0 24px 46px}.topbar{min-height:76px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:.08em}.mark{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--gold);border-radius:12px;color:var(--gold-light);font-size:20px}.back{font-size:.88rem;color:var(--gold-light);border-bottom:1px solid #b9945e;padding-bottom:3px}.eyebrow{margin:34px 0 9px;color:var(--gold);font-size:.75rem;font-weight:800;letter-spacing:.22em}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.hero h1{margin:0;font-size:clamp(2.5rem,5vw,4.2rem);letter-spacing:-.05em;line-height:1.1}.hero p{margin:9px 0 0;color:var(--muted);line-height:1.6}.timer{border:1px solid #b9945e73;border-radius:12px;padding:11px 16px;color:var(--gold-light);font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
    .layout{display:grid;grid-template-columns:minmax(0,610px) minmax(250px,1fr);gap:22px;align-items:start}.game-card,.side-card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#1d3a32,#112520);box-shadow:0 18px 48px #0003}.game-card{padding:22px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:space-between;margin-bottom:16px}.toolbar label{display:flex;align-items:center;gap:9px;font-size:.86rem;color:var(--muted)}select{border:1px solid #e9bf7260;border-radius:9px;background:#0b2621;color:var(--paper);padding:9px 30px 9px 11px}.toolbar-actions{display:flex;gap:8px}.small-btn,.tool-btn,.digit{border:1px solid #e9bf7260;border-radius:9px;background:#102d26;color:var(--gold-light);font-weight:700}.small-btn{padding:9px 12px}.small-btn:hover,.tool-btn:hover,.digit:hover{background:#244e3e}.board-wrap{display:flex;justify-content:center}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));width:min(100%,540px);aspect-ratio:1;border:3px solid var(--gold);border-radius:9px;overflow:hidden;background:#dac49b;gap:1px;touch-action:manipulation}.cell{position:relative;display:grid;place-items:center;min-width:0;min-height:0;padding:0;border:0;border-radius:0;background:#f4eee1;color:#194335;font-size:clamp(1rem,3.3vw,2rem);font-weight:750;font-variant-numeric:tabular-nums;line-height:1}.cell.box-right{border-right:2px solid #947341}.cell.box-bottom{border-bottom:2px solid #947341}.cell.fixed{background:#e9dfca;color:#244138}.cell.peer{background:#e4eddd}.cell.same{background:#d3e4ce}.cell.selected{background:#f6d995;color:#17392d;box-shadow:inset 0 0 0 2px #8e6a2e;z-index:1}.cell.conflict,.cell.wrong{background:#efb6a6;color:#6c211f}.cell .candidates{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);align-items:center;justify-items:center;font-size:clamp(.48rem,1.55vw,.8rem);font-weight:650;color:#416f56}.cell.selected .candidates{color:#265743}
    .keypad{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:7px;margin-top:17px}.digit{min-width:0;height:48px;font-size:1.15rem}.tool-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.tool-btn{min-height:43px;padding:8px 5px;font-size:.88rem}.tool-btn.active{background:var(--gold);color:#17392d;border-color:var(--gold)}.status{min-height:26px;margin:15px 0 0;color:var(--gold-light);font-size:.9rem;line-height:1.5}.status.error{color:var(--red)}.status.success{color:var(--green)}
    .side-card{padding:24px}.side-card h2{margin:0 0 14px;font-size:1.08rem}.side-card p,.side-card li{color:var(--muted);font-size:.91rem;line-height:1.8}.side-card ol{padding-left:20px;margin:0}.tip{margin-top:18px;padding:13px 15px;border:1px solid #e9bf724d;border-radius:11px;background:#e9bf720e;color:#e7d8b6;font-size:.84rem;line-height:1.7}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:780px){.layout{grid-template-columns:1fr}.side-card{padding:18px}.shell{padding:0 12px 30px}.hero{margin-bottom:16px}.hero h1{font-size:2.5rem}.game-card{padding:11px;border-radius:15px}.board{width:100%}.cell{font-size:clamp(1rem,5.7vw,1.7rem)}.cell .candidates{font-size:clamp(.47rem,2vw,.72rem)}}
    @media(max-width:390px){.toolbar{align-items:stretch}.toolbar-actions{width:100%}.small-btn{flex:1}.keypad{gap:4px}.digit{height:43px}.tool-btn{font-size:.78rem}.hero p{font-size:.84rem}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="/" aria-label="返回游戏大厅"><span class="mark">✦</span><span>GAME OVER</span></a><a class="back" href="/">← 返回游戏大厅</a></header>
    <p class="eyebrow">SOLO PUZZLE · 01</p>
    <div class="hero"><div><h1>数独</h1><p>从 1 到 9，填满属于你的九宫格。</p></div><div class="timer" aria-label="用时">⏱ <span id="time">00:00</span></div></div>
    <main class="layout">
      <section class="game-card" aria-label="数独游戏">
        <div class="toolbar"><label for="difficulty">难度 <select id="difficulty"><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option></select></label><div class="toolbar-actions"><button type="button" class="small-btn" id="restart">重开本题</button><button type="button" class="small-btn" id="new">换一题</button></div></div>
        <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="数独棋盘"></div></div>
        <div class="keypad" aria-label="输入数字"><button type="button" class="digit" data-digit="1">1</button><button type="button" class="digit" data-digit="2">2</button><button type="button" class="digit" data-digit="3">3</button><button type="button" class="digit" data-digit="4">4</button><button type="button" class="digit" data-digit="5">5</button><button type="button" class="digit" data-digit="6">6</button><button type="button" class="digit" data-digit="7">7</button><button type="button" class="digit" data-digit="8">8</button><button type="button" class="digit" data-digit="9">9</button></div>
        <div class="tool-row"><button type="button" class="tool-btn" id="erase">⌫ 擦除</button><button type="button" class="tool-btn" id="notes" aria-pressed="false">✎ 笔记：关</button><button type="button" class="tool-btn" id="check">✓ 检查</button></div>
        <p class="status" id="status" role="status" aria-live="polite">选择空格，再点击数字。每题只有一个解。</p>
      </section>
      <aside class="side-card"><h2>玩法规则</h2><ol><li>把 1～9 填进每一行、每一列和每个 3×3 宫。</li><li>同一行、列、宫内不能有重复数字；重复格会标红。</li><li>打开“笔记”后，数字会作为候选记录，不会直接填入。</li><li>填满后自动判定；也可随时点“检查”。</li></ol><div class="tip">电脑键盘：方向键移动，1～9 填数，Backspace / Delete 擦除，N 切换笔记。换题会生成一份新的唯一解题目。</div></aside>
    </main>
  </div>
  <script>
  (() => {
    'use strict';
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const timeEl = document.getElementById('time');
    const notesButton = document.getElementById('notes');
    const allDigitsMask = 0x3fe;
    const clueCounts = { easy: 40, medium: 32, hard: 27 };
    let game;
    let statusMessage = '';
    let statusTone = '';
    let noteMode = false;
    let clock;
    let cells = [];

    function shuffled(items) {
      const copy = items.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
    function solutionGrid() {
      const order = () => shuffled([0, 1, 2]).flatMap(band => shuffled([0, 1, 2]).map(within => band * 3 + within));
      const rows = order(), cols = order(), digits = shuffled([1, 2, 3, 4, 5, 6, 7, 8, 9]);
      const transpose = Math.random() < .5;
      return Array.from({ length: 81 }, (_, index) => {
        const row = Math.floor(index / 9), col = index % 9;
        const a = transpose ? cols[col] : rows[row];
        const b = transpose ? rows[row] : cols[col];
        return digits[(a * 3 + Math.floor(a / 3) + b) % 9];
      });
    }
    function candidates(grid, index) {
      const row = Math.floor(index / 9), col = index % 9;
      let used = 0;
      for (let i = 0; i < 9; i++) {
        used |= 1 << grid[row * 9 + i];
        used |= 1 << grid[i * 9 + col];
      }
      const boxRow = Math.floor(row / 3) * 3, boxCol = Math.floor(col / 3) * 3;
      for (let r = boxRow; r < boxRow + 3; r++) for (let c = boxCol; c < boxCol + 3; c++) used |= 1 << grid[r * 9 + c];
      return allDigitsMask & ~used;
    }
    function solutionCount(grid, limit = 2) {
      let found = 0;
      function search() {
        if (found >= limit) return;
        let bestIndex = -1, bestMask = 0, bestSize = 10;
        for (let index = 0; index < 81; index++) {
          if (grid[index]) continue;
          const mask = candidates(grid, index);
          let size = 0;
          for (let digit = 1; digit <= 9; digit++) if (mask & (1 << digit)) size++;
          if (size === 0) return;
          if (size < bestSize) { bestIndex = index; bestMask = mask; bestSize = size; if (size === 1) break; }
        }
        if (bestIndex === -1) { found++; return; }
        for (let digit = 1; digit <= 9; digit++) {
          if (!(bestMask & (1 << digit))) continue;
          grid[bestIndex] = digit;
          search();
          grid[bestIndex] = 0;
          if (found >= limit) return;
        }
      }
      search();
      return found;
    }
    function makePuzzle(difficulty) {
      const answer = solutionGrid(), puzzle = answer.slice();
      let remaining = 81;
      for (const index of shuffled(Array.from({ length: 81 }, (_, i) => i))) {
        if (remaining <= clueCounts[difficulty]) break;
        const old = puzzle[index];
        puzzle[index] = 0;
        if (solutionCount(puzzle.slice()) === 1) remaining--;
        else puzzle[index] = old;
      }
      return { answer, puzzle };
    }
    function setStatus(message, tone = '') { statusMessage = message; statusTone = tone; updateStatus(); }
    function updateStatus() {
      const conflicts = conflictCells();
      statusEl.textContent = conflicts.size ? `有 ${conflicts.size} 个重复格，请检查同一行、列或宫。` : statusMessage;
      statusEl.className = 'status' + (conflicts.size ? ' error' : statusTone ? ` ${statusTone}` : '');
    }
    function conflictCells() {
      const bad = new Set();
      if (!game) return bad;
      function check(indices) {
        const seen = new Map();
        for (const index of indices) {
          const digit = game.values[index];
          if (!digit) continue;
          if (!seen.has(digit)) seen.set(digit, []);
          seen.get(digit).push(index);
        }
        for (const group of seen.values()) if (group.length > 1) group.forEach(index => bad.add(index));
      }
      for (let n = 0; n < 9; n++) {
        check(Array.from({ length: 9 }, (_, i) => n * 9 + i));
        check(Array.from({ length: 9 }, (_, i) => i * 9 + n));
      }
      for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++) check(Array.from({ length: 9 }, (_, i) => (br * 3 + Math.floor(i / 3)) * 9 + bc * 3 + i % 3));
      return bad;
    }
    function buildBoard() {
      boardEl.replaceChildren();
      cells = Array.from({ length: 81 }, (_, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'cell';
        button.setAttribute('role', 'gridcell');
        button.addEventListener('click', () => { game.selected = index; render(); });
        boardEl.append(button);
        return button;
      });
    }
    function render() {
      if (!game) return;
      const conflicts = conflictCells();
      const selected = game.selected;
      const sr = Math.floor(selected / 9), sc = selected % 9;
      const selectedValue = game.values[selected];
      for (let index = 0; index < 81; index++) {
        const row = Math.floor(index / 9), col = index % 9;
        const button = cells[index], digit = game.values[index], notes = game.notes[index];
        const peer = row === sr || col === sc || (Math.floor(row / 3) === Math.floor(sr / 3) && Math.floor(col / 3) === Math.floor(sc / 3));
        button.className = 'cell';
        if (col === 2 || col === 5) button.classList.add('box-right');
        if (row === 2 || row === 5) button.classList.add('box-bottom');
        if (game.puzzle[index]) button.classList.add('fixed');
        if (peer) button.classList.add('peer');
        if (digit && digit === selectedValue) button.classList.add('same');
        if (index === selected) button.classList.add('selected');
        if (conflicts.has(index)) button.classList.add('conflict');
        if (game.wrong.has(index)) button.classList.add('wrong');
        button.replaceChildren();
        if (digit) button.textContent = String(digit);
        else if (notes.size) {
          const grid = document.createElement('span'); grid.className = 'candidates';
          for (let n = 1; n <= 9; n++) { const mark = document.createElement('span'); mark.textContent = notes.has(n) ? String(n) : ''; grid.append(mark); }
          button.append(grid);
        }
        const detail = digit ? `数字 ${digit}${game.puzzle[index] ? '，题目已给出' : ''}` : notes.size ? `笔记 ${[...notes].sort().join('、')}` : '空格';
        button.setAttribute('aria-label', `第 ${row + 1} 行第 ${col + 1} 列，${detail}`);
        button.setAttribute('aria-selected', index === selected ? 'true' : 'false');
      }
      notesButton.classList.toggle('active', noteMode);
      notesButton.setAttribute('aria-pressed', String(noteMode));
      notesButton.textContent = `✎ 笔记：${noteMode ? '开' : '关'}`;
      updateStatus();
    }
    function updateTime() {
      if (!game) return;
      const seconds = Math.floor(((game.completed ? game.finishedAt : Date.now()) - game.startedAt) / 1000);
      timeEl.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }
    function resetCurrent() {
      game.values = game.puzzle.slice();
      game.notes = Array.from({ length: 81 }, () => new Set());
      game.wrong = new Set();
      game.selected = game.puzzle.findIndex(value => value === 0);
      game.startedAt = Date.now(); game.finishedAt = null; game.completed = false;
      noteMode = false;
      setStatus('选择空格，再点击数字。每题只有一个解。');
      render(); updateTime();
    }
    function newGame() {
      const difficulty = document.getElementById('difficulty').value;
      setStatus('正在生成唯一解题目…');
      const { answer, puzzle } = makePuzzle(difficulty);
      game = { answer, puzzle };
      buildBoard();
      resetCurrent();
    }
    function winIfComplete() {
      if (game.values.some(value => !value)) return;
      if (game.values.every((value, index) => value === game.answer[index])) {
        game.completed = true; game.finishedAt = Date.now(); updateTime();
        setStatus('全部正确！恭喜完成，可以换一题继续挑战。', 'success');
      } else setStatus('所有格子已填满，还有数字不正确。点“检查”查看。', 'error');
    }
    function enterDigit(digit) {
      if (!game || game.completed || game.puzzle[game.selected]) return;
      const index = game.selected;
      if (noteMode && game.values[index]) { setStatus("先擦除当前数字，再记录候选笔记。"); return; }
      game.wrong.clear();
      if (noteMode) { if (game.notes[index].has(digit)) game.notes[index].delete(digit); else game.notes[index].add(digit); }
      else { game.values[index] = digit; game.notes[index].clear(); }
      setStatus(noteMode ? '已更新候选笔记。' : '继续填数，重复数字会立即标红。');
      render(); winIfComplete();
    }
    function erase() {
      if (!game || game.completed || game.puzzle[game.selected]) return;
      game.values[game.selected] = 0; game.notes[game.selected].clear(); game.wrong.clear();
      setStatus('已擦除选中格。'); render();
    }
    function validate() {
      if (!game) return;
      game.wrong = new Set();
      for (let index = 0; index < 81; index++) if (game.values[index] && game.values[index] !== game.answer[index]) game.wrong.add(index);
      const blank = game.values.filter(value => !value).length;
      if (game.wrong.size) setStatus(`有 ${game.wrong.size} 个数字不正确，已标红。`, 'error');
      else if (blank) setStatus(`目前填写正确，还有 ${blank} 格待完成。`, 'success');
      else winIfComplete();
      render();
    }
    document.querySelectorAll('[data-digit]').forEach(button => button.addEventListener('click', () => enterDigit(Number(button.dataset.digit))));
    document.getElementById('erase').addEventListener('click', erase);
    document.getElementById('notes').addEventListener('click', () => { noteMode = !noteMode; render(); });
    document.getElementById('check').addEventListener('click', validate);
    document.getElementById('restart').addEventListener('click', resetCurrent);
    document.getElementById('new').addEventListener('click', newGame);
    document.getElementById('difficulty').addEventListener('change', newGame);
    document.addEventListener('keydown', event => {
      if (!game || event.target.tagName === 'SELECT') return;
      const key = event.key;
      if (/^[1-9]$/.test(key)) { event.preventDefault(); enterDigit(Number(key)); return; }
      if (key === 'Backspace' || key === 'Delete' || key === '0') { event.preventDefault(); erase(); return; }
      if (key.toLowerCase() === 'n') { event.preventDefault(); noteMode = !noteMode; render(); return; }
      const move = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 }[key];
      if (move === undefined) return;
      event.preventDefault();
      const row = Math.floor(game.selected / 9), col = game.selected % 9;
      const nextRow = Math.max(0, Math.min(8, row + (key === 'ArrowUp' ? -1 : key === 'ArrowDown' ? 1 : 0)));
      const nextCol = Math.max(0, Math.min(8, col + (key === 'ArrowLeft' ? -1 : key === 'ArrowRight' ? 1 : 0)));
      game.selected = nextRow * 9 + nextCol; render(); cells[game.selected].focus();
    });
    newGame();
    clock = setInterval(updateTime, 1000);
  })();
  </script>
</body>
</html>
