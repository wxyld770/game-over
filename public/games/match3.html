<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d32">
  <meta name="description" content="无尽随机消消乐：交换宝石触发三连、连锁下落，并挑战全站高分榜。">
  <title>消消乐 · 小游戏大厅</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/match3-rules.js"></script>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color-scheme:dark;--paper:#f7f3ea;--muted:#adc4c6;--gold:#f1cb83;--panel:#14343a;--line:rgba(255,255,255,.16);--bg:#0d282e}
    *{box-sizing:border-box} [hidden]{display:none!important} body{min-width:320px;min-height:100vh;margin:0;color:var(--paper);background:linear-gradient(150deg,#15505a 0,#0d3038 36%,#10252c 100%)} button,input{font:inherit} button{cursor:pointer} button:disabled{cursor:default;opacity:.52} a{color:inherit} :focus-visible{outline:3px solid #ffe1a0;outline-offset:3px}
    .shell{width:min(1180px,100%);margin:auto;padding:22px 22px 48px} header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:22px}.back{color:var(--gold);font-weight:800;text-decoration:none}.back:hover{text-decoration:underline}.brand{color:#c3d8da;font-size:.76rem;letter-spacing:.2em}
    .intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.intro h1{margin:0;font-size:clamp(2rem,5vw,3.35rem);letter-spacing:0}.intro p{max-width:560px;margin:8px 0 0;color:#d0ddde;line-height:1.55}.run-state{min-height:20px;margin:0;color:#bcd0d1;font-size:.78rem;text-align:right}
    .layout{display:grid;grid-template-columns:minmax(0,760px) minmax(260px,330px);gap:24px;align-items:start}.game-panel{min-width:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.stat{min-height:72px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:rgba(6,31,37,.48)}.stat span{display:block;color:var(--muted);font-size:.75rem}.stat strong{display:block;margin-top:5px;color:#fff1c9;font-size:1.42rem;font-variant-numeric:tabular-nums}.stat.combo strong{color:#a7efd6}
    .board-frame{position:relative;width:100%;max-width:720px}.grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:clamp(3px,.65vw,6px);width:100%;aspect-ratio:9/8;padding:clamp(7px,1.2vw,12px);border:1px solid #4e777b;border-radius:8px;background:#08242a;box-shadow:0 24px 55px rgba(0,0,0,.25);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}.gem{position:relative;display:grid;place-items:center;min-width:0;min-height:0;padding:0;border:1px solid rgba(255,255,255,.2);border-radius:8px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.17),0 3px 8px rgba(0,0,0,.2);font-size:clamp(17px,3.6vw,36px);line-height:1;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease,opacity .2s ease}.gem:hover:not(:disabled){filter:brightness(1.15);transform:scale(1.04)}.gem.selected{z-index:3;transform:scale(1.08);box-shadow:0 0 0 3px #fff3c9,0 0 20px #ffde91}.gem.hinted{z-index:3;animation:hint .78s ease-in-out infinite alternate;box-shadow:0 0 0 3px #fff2c0,0 0 22px #f9d985}.gem.exchanging{z-index:4;animation:exchange .2s ease-out both}.gem.falling{z-index:2;animation:fall var(--fall-ms,300ms) cubic-bezier(.18,.78,.3,1) both}.gem.clearing{z-index:5;animation:clear .3s ease-in both}.gem.shaking{animation:shake .28s ease}.gem[data-kind="0"]{color:#ffe0e3;background:#d84e69}.gem[data-kind="1"]{color:#d8f8ff;background:#2b9bc1}.gem[data-kind="2"]{color:#fff0b8;background:#d6a933}.gem[data-kind="3"]{color:#eee1ff;background:#8b66c8}.gem[data-kind="4"]{color:#e4ffd5;background:#57a665}.gem[data-kind="5"]{color:#fff0df;background:#d7774f}
    .message{min-height:48px;margin:13px 2px 0;color:#d7e3e4;font-size:.88rem;line-height:1.55}.message.success{color:#b8efd6}.message.error{color:#ffc2aa}.tools{display:flex;flex-wrap:wrap;gap:9px}.tool{min-height:42px;padding:0 15px;border:1px solid rgba(241,203,131,.62);border-radius:8px;background:rgba(241,203,131,.08);color:#f7d99d;font-weight:800}.tool:hover:not(:disabled){background:rgba(241,203,131,.17)}.tool.primary{color:#202b2b;background:#f1cb83}.tool.danger{margin-left:auto;border-color:rgba(255,174,145,.55);color:#ffc2aa}
    .score-guide{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:18px}.score-rule{padding:9px 8px;border-top:1px solid var(--line);color:var(--muted);font-size:.74rem}.score-rule strong{display:block;margin-bottom:3px;color:#fff1c9;font-size:.92rem}
    .leaderboard{min-width:0;padding-left:22px;border-left:1px solid var(--line)}.leaderboard-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.leaderboard h2{margin:0;font-size:1.25rem}.leaderboard small{display:block;margin-top:4px;color:var(--muted)}.icon-button{display:grid;place-items:center;width:38px;height:38px;padding:0;border:1px solid rgba(241,203,131,.55);border-radius:8px;background:transparent;color:var(--gold);font-size:1.3rem}.mine{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:17px 0;padding-bottom:15px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.76rem}.mine strong{display:block;margin-top:6px;color:#f8d995;font-size:1.1rem}.ranking{margin:0;padding:0;list-style:none}.ranking li{display:grid;grid-template-columns:28px minmax(0,1fr) 6ch;align-items:center;gap:7px;min-height:40px;border-bottom:1px solid rgba(255,255,255,.08);font-size:.84rem}.ranking .place{color:#95b1b4}.ranking li:nth-child(-n+3) .place{color:var(--gold);font-weight:900}.ranking .name{overflow-wrap:anywhere}.ranking .points{text-align:right;font-weight:850;font-variant-numeric:tabular-nums}.ranking-status{min-height:22px;margin:12px 0;color:var(--muted);font-size:.8rem}.ranking-status.error{color:#ffc2aa}
    .end-overlay{position:absolute;inset:8px;z-index:10;display:grid;place-items:center;padding:18px;border-radius:8px;background:rgba(4,25,30,.9);backdrop-filter:blur(5px)}.end-dialog{width:min(390px,100%);padding:24px;border:1px solid rgba(241,203,131,.55);border-radius:8px;background:#173840;box-shadow:0 20px 50px #0008}.end-dialog h2{margin:0 0 7px;color:#ffe3a9}.end-dialog p{margin:0 0 16px;color:#d1dfe0;line-height:1.55}.submit-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.submit-row input{min-width:0;height:43px;padding:0 12px;border:1px solid #718d90;border-radius:8px;background:#0a2930;color:white}.submit-status{min-height:20px;margin:10px 0!important;font-size:.8rem}.end-actions{display:flex;gap:8px}.end-actions button{flex:1}.feedback{margin:24px 0 0;color:var(--muted);font-size:.8rem}.feedback a{color:var(--gold)}
    @keyframes hint{to{transform:scale(1.12);filter:brightness(1.35)}}@keyframes exchange{from{transform:translate(var(--swap-x),var(--swap-y)) scale(.96)}to{transform:translate(0,0)}}@keyframes fall{from{transform:translateY(var(--fall-y));filter:brightness(1.2)}to{transform:translateY(0)}}@keyframes clear{45%{transform:scale(1.22);filter:brightness(1.6)}to{transform:scale(.1) rotate(18deg);opacity:0}}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.leaderboard{padding:22px 0 0;border-left:0;border-top:1px solid var(--line)}.ranking{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}}@media(max-width:580px){.shell{padding:15px 11px 34px}.intro{align-items:start;flex-direction:column}.run-state{text-align:left}.stats{grid-template-columns:repeat(2,1fr)}.grid{gap:3px;padding:6px}.gem{border-radius:5px;font-size:clamp(15px,5.2vw,24px)}.tool{flex:1;padding:0 9px}.tool.danger{margin-left:0}.score-guide{grid-template-columns:repeat(2,1fr)}.ranking{grid-template-columns:1fr}.submit-row{grid-template-columns:1fr}.brand{font-size:.66rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header><a class="back" href="/">← 游戏大厅</a><span class="brand">GAME OVER · MATCH THREE</span></header>
    <div class="intro"><div><h1>消消乐</h1><p>交换相邻宝石，连续消除会自动下落并补充新宝石。</p></div><p class="run-state" id="runState" role="status"></p></div>
    <main class="layout">
      <section class="game-panel" aria-label="无尽消消乐">
        <div class="stats"><div class="stat"><span>当前得分</span><strong id="score">0</strong></div><div class="stat"><span>本机最高</span><strong id="best">0</strong></div><div class="stat"><span>有效交换</span><strong id="moves">0</strong></div><div class="stat combo"><span>本次连锁</span><strong id="combo">—</strong></div></div>
        <div class="board-frame" id="boardFrame">
          <div class="grid" id="grid" role="grid" aria-label="8 行 9 列随机宝石棋盘"></div>
          <div class="end-overlay" id="endOverlay" hidden>
            <div class="end-dialog" role="dialog" aria-modal="true" aria-labelledby="endTitle">
              <h2 id="endTitle">本局结束</h2><p id="endSummary"></p>
              <form id="scoreForm"><div class="submit-row"><input id="nickname" maxlength="18" autocomplete="nickname" placeholder="输入昵称" aria-label="排行榜昵称" required><button class="tool primary" id="submitScore" type="submit">提交成绩</button></div></form>
              <p class="submit-status" id="submitStatus" role="status" aria-live="polite"></p>
              <div class="end-actions"><button class="tool" id="resume" type="button">继续消除</button><button class="tool primary" id="newGame" type="button">新开一局</button></div>
            </div>
          </div>
        </div>
        <p class="message" id="message" role="status" aria-live="polite">选择两颗相邻宝石进行交换。</p>
        <div class="tools"><button class="tool" id="hint" type="button">✦ 提示</button><button class="tool" id="restart" type="button">↻ 重新开始</button><button class="tool danger" id="finish" type="button">结束并上榜</button></div>
        <div class="score-guide" aria-label="计分规则"><div class="score-rule"><strong>三连 +30</strong>基础消除</div><div class="score-rule"><strong>四连 +90</strong>长线奖励</div><div class="score-rule"><strong>五连 +180</strong>高阶奖励</div><div class="score-rule"><strong>T 形 7 颗 +500</strong>连锁再乘倍数</div></div>
      </section>
      <aside class="leaderboard" aria-labelledby="rankingTitle">
        <div class="leaderboard-head"><div><h2 id="rankingTitle">全站排行榜</h2><small>历史最高 · TOP 20</small></div><button class="icon-button" id="refreshRanking" type="button" title="刷新排行榜" aria-label="刷新排行榜">↻</button></div>
        <div class="mine"><div>我的排名<strong id="myRank">--</strong></div><div>已上榜最高分<strong id="myBest">--</strong></div></div>
        <ol class="ranking" id="ranking"></ol><p class="ranking-status" id="rankingStatus" role="status">正在加载排行榜...</p>
        <p class="feedback"><a href="mailto:wxyld770@gmail.com?subject=GAME%20OVER%20%E6%B6%88%E6%B6%88%E4%B9%90%E5%8F%8D%E9%A6%88">反馈问题</a></p>
      </aside>
    </main>
  </div>
  <script>
  (() => {
    'use strict';
    const rules = window.Match3Rules;
    const glyphs = ['♥', '◆', '★', '✦', '⬟', '●'];
    const names = ['红宝石', '蓝宝石', '金星', '紫水晶', '绿宝石', '琥珀'];
    const $ = id => document.getElementById(id);
    const grid = $('grid');
    const tiles = [];
    const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
    let game;
    let displayBoard = [];
    let selected = -1;
    let hinted = [];
    let busy = true;
    let paused = false;
    let rankedRun = null;
    let moveHistory = [];
    let pointerStart = null;
    let lastSwipe = null;
    let displayScore = 0;
    let displayCombo = 0;
    let rankingLoading = false;
    let submitting = false;
    let localBest = 0;
    try {
      localBest = Math.max(0, Number(localStorage.getItem('match3:best')) || 0);
      $('nickname').value = localStorage.getItem('match3:name') || '';
    } catch {}

    function setMessage(text, tone = '') {
      $('message').textContent = text;
      $('message').className = `message${tone ? ` ${tone}` : ''}`;
    }

    function randomSeed() {
      const values = new Uint32Array(1);
      crypto.getRandomValues(values);
      return values[0];
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        credentials: 'same-origin',
        signal: AbortSignal.timeout(10_000),
        headers: { ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...options.headers },
        ...options,
      });
      let body = {};
      try { body = await response.json(); } catch {}
      if (!response.ok) throw new Error(body.error || '请求失败，请稍后再试');
      return body;
    }

    function buildTiles() {
      const fragment = document.createDocumentFragment();
      for (let index = 0; index < rules.TOTAL; index += 1) {
        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'gem';
        tile.dataset.index = String(index);
        tile.setAttribute('role', 'gridcell');
        fragment.append(tile);
        tiles.push(tile);
      }
      grid.replaceChildren(fragment);
    }

    function render() {
      for (let index = 0; index < rules.TOTAL; index += 1) {
        const tile = tiles[index];
        const kind = displayBoard[index];
        tile.className = 'gem';
        if (index === selected) tile.classList.add('selected');
        if (hinted.includes(index)) tile.classList.add('hinted');
        tile.dataset.kind = String(kind);
        tile.textContent = glyphs[kind] || '';
        tile.disabled = busy || paused;
        tile.setAttribute('aria-label', `第 ${Math.floor(index / rules.COLS) + 1} 行第 ${index % rules.COLS + 1} 列：${names[kind] || '空位'}`);
        tile.setAttribute('aria-selected', String(index === selected));
      }
      $('score').textContent = displayScore.toLocaleString('zh-CN');
      $('best').textContent = localBest.toLocaleString('zh-CN');
      $('moves').textContent = String(game?.moves || 0);
      $('combo').textContent = displayCombo > 1 ? `×${displayCombo}` : '—';
      $('hint').disabled = busy || paused || !game;
      $('finish').disabled = busy || paused || !game || game.score <= 0;
      $('restart').disabled = busy;
    }

    function renderRanking(data) {
      $('ranking').replaceChildren();
      for (const entry of data.entries || []) {
        const item = document.createElement('li');
        const place = document.createElement('span');
        const name = document.createElement('span');
        const points = document.createElement('span');
        place.className = 'place'; name.className = 'name'; points.className = 'points';
        place.textContent = entry.rank; name.textContent = entry.name; points.textContent = entry.score.toLocaleString('zh-CN');
        item.append(place, name, points); $('ranking').append(item);
      }
      $('myRank').textContent = data.me ? `#${data.me.rank}` : '--';
      $('myBest').textContent = data.me ? data.me.score.toLocaleString('zh-CN') : '--';
      $('rankingStatus').className = 'ranking-status';
      $('rankingStatus').textContent = data.entries?.length ? '' : '还没有上榜成绩。';
    }

    async function loadRanking() {
      if (rankingLoading) return;
      rankingLoading = true;
      $('rankingStatus').className = 'ranking-status';
      $('rankingStatus').textContent = '正在加载排行榜...';
      try { renderRanking(await request('/api/match3/leaderboard')); }
      catch (error) {
        $('rankingStatus').className = 'ranking-status error';
        $('rankingStatus').textContent = error.name === 'TimeoutError' || error.name === 'TypeError' ? '无法连接排行榜，请稍后刷新。' : error.message;
      } finally { rankingLoading = false; }
    }

    async function startGame() {
      busy = true; paused = false; rankedRun = null; moveHistory = []; selected = -1; hinted = [];
      displayScore = 0; displayCombo = 0;
      $('endOverlay').hidden = true;
      $('submitStatus').textContent = '';
      $('scoreForm').hidden = false;
      $('runState').textContent = '正在准备随机棋盘...';
      render();
      let seed = randomSeed();
      try {
        const create = () => request('/api/match3/runs', { method: 'POST', body: '{}' });
        rankedRun = navigator.locks?.request
          ? await navigator.locks.request('game-over:match3:start', create)
          : await create();
        seed = rankedRun.seed;
        $('runState').textContent = '本局成绩可提交全站排行榜';
      } catch {
        $('runState').textContent = '排行榜连接失败，本局仍可游玩';
      }
      game = rules.createGame(seed);
      displayBoard = game.board.slice();
      busy = false;
      setMessage('选择两颗相邻宝石进行交换。');
      render();
    }

    function shapeLabel(groups) {
      if (groups.some(group => group.shape === 't7')) return 'T 形七连';
      if (groups.some(group => group.shape === 'cross')) return '交叉消除';
      if (groups.some(group => group.shape === 'five')) return '五连';
      if (groups.some(group => group.shape === 'four')) return '四连';
      return '三连';
    }

    async function trySwap(a, b) {
      if (busy || paused || !rules.adjacent(a, b)) return;
      const aRect = tiles[a].getBoundingClientRect();
      const bRect = tiles[b].getBoundingClientRect();
      const result = rules.swap(game, a, b);
      selected = -1; hinted = [];
      if (!result.valid) {
        render();
        tiles[a].classList.add('shaking'); tiles[b].classList.add('shaking');
        setMessage(result.reason === 'limit' ? '本次排行记录已到上限，请结束并提交成绩。' : '这次交换没有形成三连。');
        return;
      }
      if (rankedRun && moveHistory.length < rules.MAX_MOVES * 2) moveHistory.push(a, b);
      else if (rankedRun) {
        rankedRun = null;
        moveHistory = [];
        $('runState').textContent = '已继续超过上榜记录范围，本局可在本机无限游玩';
      }
      busy = true;
      displayBoard = result.swapped.slice();
      render();
      tiles[a].style.setProperty('--swap-x', `${bRect.left - aRect.left}px`);
      tiles[a].style.setProperty('--swap-y', `${bRect.top - aRect.top}px`);
      tiles[b].style.setProperty('--swap-x', `${aRect.left - bRect.left}px`);
      tiles[b].style.setProperty('--swap-y', `${aRect.top - bRect.top}px`);
      tiles[a].classList.add('exchanging'); tiles[b].classList.add('exchanging');
      await wait(210);
      let earned = 0;
      let lastLabel = '三连';
      for (const stage of result.stages) {
        displayBoard = stage.before.slice();
        displayCombo = stage.combo;
        render();
        for (const index of stage.matched) tiles[index].classList.add('clearing');
        await wait(310);
        displayBoard = stage.after.slice();
        displayScore = stage.totalScore;
        earned += stage.points;
        lastLabel = shapeLabel(stage.groups);
        render();
        const cellHeight = tiles[0].getBoundingClientRect().height + 5;
        for (const drop of stage.drops) {
          tiles[drop.to].style.setProperty('--fall-y', `${-(Math.floor(drop.to / rules.COLS) - Math.floor(drop.from / rules.COLS)) * cellHeight}px`);
          tiles[drop.to].classList.add('falling');
        }
        for (const spawn of stage.spawns) {
          tiles[spawn.to].style.setProperty('--fall-y', `${-(Math.floor(spawn.to / rules.COLS) + 2) * cellHeight}px`);
          tiles[spawn.to].classList.add('falling');
        }
        await wait(320);
      }
      displayBoard = game.board.slice();
      displayScore = game.score;
      displayCombo = result.stages.length;
      if (game.score > localBest) {
        localBest = game.score;
        try { localStorage.setItem('match3:best', String(localBest)); } catch {}
      }
      if (rankedRun && Date.now() >= rankedRun.expiresAt) {
        rankedRun = null;
        moveHistory = [];
        $('runState').textContent = '本局超过上榜记录范围，可继续在本机游玩';
      } else if (rankedRun && moveHistory.length === rules.MAX_MOVES * 2) {
        $('runState').textContent = '已达到上榜记录上限，可现在结束提交或继续本机游玩';
      }
      busy = false;
      setMessage(`${lastLabel}，本次获得 ${earned.toLocaleString('zh-CN')} 分${result.stages.length > 1 ? `，触发 ${result.stages.length} 连锁` : ''}${result.reshuffled ? '；棋盘已自动重排' : ''}。`, 'success');
      render();
    }

    function choose(index) {
      if (busy || paused) return;
      if (selected === index) selected = -1;
      else if (selected >= 0 && rules.adjacent(selected, index)) { trySwap(selected, index); return; }
      else selected = index;
      hinted = [];
      render();
    }

    function showHint() {
      if (busy || paused || !game) return;
      const move = rules.findMoves(game.board, 1)[0];
      if (!move) return;
      hinted = move; selected = -1;
      setMessage('高亮的两颗宝石交换后可以消除。');
      render();
      tiles[move[0]].focus();
    }

    function finishRun() {
      if (busy || paused || !game || game.score <= 0) return;
      paused = true; selected = -1; hinted = [];
      $('endSummary').textContent = `本局 ${game.score.toLocaleString('zh-CN')} 分，共完成 ${game.moves} 次有效交换。`;
      $('scoreForm').hidden = !rankedRun;
      $('submitStatus').textContent = rankedRun ? '填写昵称后提交本局最高分。' : '本局未连接排行榜，成绩已保存在本机。';
      $('endOverlay').hidden = false;
      render();
      if (rankedRun) $('nickname').focus(); else $('newGame').focus();
    }

    async function submitScore(event) {
      event.preventDefault();
      if (submitting || !rankedRun || !paused) return;
      const name = $('nickname').value.normalize('NFKC').trim().replace(/\s+/gu, ' ');
      if (!name || [...name].length > 18) { $('submitStatus').textContent = '请输入 1 到 18 个字符的昵称。'; return; }
      const submittedRun = rankedRun;
      const submittedMoves = moveHistory.slice();
      submitting = true;
      $('submitScore').disabled = true;
      $('resume').disabled = true;
      $('newGame').disabled = true;
      $('submitStatus').textContent = '正在校验并提交...';
      try {
        const result = await request(`/api/match3/runs/${submittedRun.runId}/finish`, {
          method: 'POST', body: JSON.stringify({ name, moves: submittedMoves }),
        });
        try { localStorage.setItem('match3:name', name); } catch {}
        $('submitStatus').textContent = result.isPersonalBest
          ? `新纪录 ${result.personalBest.toLocaleString('zh-CN')} 分，当前第 ${result.rank} 名！`
          : `成绩已提交，个人最高 ${result.personalBest.toLocaleString('zh-CN')} 分，当前第 ${result.rank} 名。`;
        renderRanking(result);
        $('scoreForm').hidden = true;
        if (rankedRun === submittedRun) {
          rankedRun = null;
          moveHistory = [];
          $('runState').textContent = '本局成绩已提交，继续消除将只保存在本机';
        }
      } catch (error) { $('submitStatus').textContent = error.message; }
      finally {
        submitting = false;
        $('submitScore').disabled = false;
        $('resume').disabled = false;
        $('newGame').disabled = false;
      }
    }

    grid.addEventListener('click', event => {
      const tile = event.target.closest('.gem');
      const samePointer = event.pointerId === undefined || event.pointerId <= 0 || event.pointerId === lastSwipe?.id;
      if (lastSwipe && samePointer && tile && Number(tile.dataset.index) === lastSwipe.from
          && performance.now() - lastSwipe.at < (lastSwipe.type === 'mouse' ? 120 : 400)) { lastSwipe = null; return; }
      if (tile && !tile.disabled) choose(Number(tile.dataset.index));
    });
    grid.addEventListener('pointerdown', event => {
      if (pointerStart) return;
      const tile = event.target.closest('.gem');
      pointerStart = tile && !tile.disabled ? { index: Number(tile.dataset.index), x: event.clientX, y: event.clientY, id: event.pointerId, type: event.pointerType } : null;
      if (pointerStart) tile.setPointerCapture(event.pointerId);
    });
    grid.addEventListener('pointerup', event => {
      if (!pointerStart || pointerStart.id !== event.pointerId) return;
      const from = pointerStart; pointerStart = null;
      const dx = event.clientX - from.x; const dy = event.clientY - from.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
      lastSwipe = { at: performance.now(), id: from.id, type: from.type, from: from.index };
      const to = Math.abs(dx) > Math.abs(dy) ? from.index + (dx > 0 ? 1 : -1) : from.index + (dy > 0 ? rules.COLS : -rules.COLS);
      if (rules.adjacent(from.index, to)) trySwap(from.index, to);
    });
    grid.addEventListener('pointercancel', () => { pointerStart = null; });
    grid.addEventListener('keydown', event => {
      const tile = event.target.closest('.gem');
      if (!tile) return;
      const index = Number(tile.dataset.index);
      const offset = { ArrowUp: -rules.COLS, ArrowDown: rules.COLS, ArrowLeft: -1, ArrowRight: 1 }[event.key];
      if (offset !== undefined) {
        event.preventDefault();
        const next = index + offset;
        if (rules.adjacent(index, next)) tiles[next].focus();
      } else if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); choose(index); }
      else if (event.key.toLowerCase() === 'h') { event.preventDefault(); showHint(); }
    });
    $('hint').addEventListener('click', showHint);
    $('finish').addEventListener('click', finishRun);
    $('restart').addEventListener('click', startGame);
    $('newGame').addEventListener('click', startGame);
    $('resume').addEventListener('click', () => { paused = false; $('endOverlay').hidden = true; render(); });
    $('scoreForm').addEventListener('submit', submitScore);
    $('refreshRanking').addEventListener('click', loadRanking);
    buildTiles();
    render();
    loadRanking();
    startGame();
  })();
  </script>
</body>
</html>
