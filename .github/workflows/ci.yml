name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-over-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify game
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js

      - name: Run game tests
        run: node --test test/*.test.js

      - name: Package tested source
        id: package
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/game-over-${GITHUB_SHA}.tar.gz"
          tar --create --gzip --file="${bundle}" \
            --format=ustar --sort=name --mtime='@0' \
            --owner=0 --group=0 --numeric-owner \
            --no-recursion \
            server.js package.json \
            public/app.js public/favicon.svg public/index.html public/styles.css
          digest="$(sha256sum "${bundle}" | awk '{print $1}')"
          printf 'sha256=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'bundle=%s\n' "${bundle}" >> "${GITHUB_OUTPUT}"

      - name: Upload immutable release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-over-release-${{ github.sha }}
          path: ${{ steps.package.outputs.bundle }}
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://game.5iyeji.xyz/
    concurrency:
      group: game-over-production
      cancel-in-progress: false
    steps:
      - name: Check out SSH host key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: game-over-release-${{ github.sha }}
          path: ${{ runner.temp }}/game-over-release
          digest-mismatch: error

      - name: Validate release and main head
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          bundle="${RUNNER_TEMP}/game-over-release/game-over-${GITHUB_SHA}.tar.gz"
          [[ -f "${bundle}" && ! -L "${bundle}" ]]
          [[ "$(sha256sum "${bundle}" | awk '{print $1}')" == "${EXPECTED_SHA256}" ]]
          main_head="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk 'NR == 1 {print $1}')"
          [[ "${main_head}" == "${GITHUB_SHA}" ]] || {
            echo "A newer main commit exists; skipping stale deployment." >&2
            exit 1
          }

      - name: Upload and activate release
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "${PROD_SSH_PRIVATE_KEY}" ]] || { echo 'Missing PROD_SSH_PRIVATE_KEY secret.' >&2; exit 1; }

          ssh_dir="$(mktemp -d "${RUNNER_TEMP}/game-over-ssh.XXXXXX")"
          trap 'rm -rf -- "${ssh_dir}"' EXIT
          private_key="${ssh_dir}/id_ed25519"
          known_hosts="${ssh_dir}/known_hosts"
          printf '%s\n' "${PROD_SSH_PRIVATE_KEY}" > "${private_key}"
          chmod 0600 "${private_key}"
          ssh-keygen -y -P '' -f "${private_key}" > "${ssh_dir}/id_ed25519.pub"
          [[ "$(ssh-keygen -lf "${ssh_dir}/id_ed25519.pub" -E sha256 | awk '{print $2}')" == 'SHA256:gGbG1PyuIEkBrFZJIPlr2LUajqZD92+EDeePM2Yazzo' ]]

          cp deploy/known_hosts "${known_hosts}"
          chmod 0600 "${known_hosts}"
          [[ "$(ssh-keygen -lf "${known_hosts}" -E sha256 | awk '{print $2}')" == 'SHA256:QNC5ZaYfXItgvd93c+7sio/D5gmkiTjDfml04OekH3E' ]]

          remote='game-over-deploy@game.5iyeji.xyz'
          remote_dir="/var/lib/game-over-deploy/incoming/${GITHUB_SHA}"
          bundle="${RUNNER_TEMP}/game-over-release/game-over-${GITHUB_SHA}.tar.gz"
          ssh_options=(
            -i "${private_key}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${known_hosts}"
            -o GlobalKnownHostsFile=/dev/null
            -o HostKeyAlgorithms=ssh-ed25519
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o ClearAllForwardings=yes
            -o ConnectTimeout=15
          )

          ssh "${ssh_options[@]}" -p 22 "${remote}" \
            "mkdir -p '${remote_dir}' && chmod 700 '${remote_dir}'"
          scp "${ssh_options[@]}" -P 22 -- "${bundle}" "${remote}:${remote_dir}/release.tar.gz"
          ssh "${ssh_options[@]}" -p 22 "${remote}" \
            "sudo -n /usr/local/sbin/deploy-game-over '${GITHUB_SHA}' '${EXPECTED_SHA256}'"

      - name: Verify public site
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 \
            --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            https://game.5iyeji.xyz/api/health \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["ok"] is True'
          curl --proto '=https' --tlsv1.2 \
            --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /dev/null https://game.5iyeji.xyz/
