# Final site: install after acme.sh has written the certificate files below.
server {
    listen 80;
    listen [::]:80;
    server_name game.5iyeji.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name game.5iyeji.xyz;

    ssl_certificate /etc/nginx/ssl/game.5iyeji.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/game.5iyeji.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/game-over.access.log;
    error_log /var/log/nginx/game-over.error.log;
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
